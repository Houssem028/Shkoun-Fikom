<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شكون فيكم؟</title>

  <style>
    /* ================================
       RESET
    ================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(circle at 50% -10%, #30250d 0%, #11100d 28%, #070707 65%);
      color: #f5f0e5;
      font-family: Arial, Tahoma, sans-serif;
      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .hidden {
      display: none !important;
    }


    /* ================================
       SCREENS
    ================================= */

    .screen {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px 16px 100px;
    }

    #nameScreen {
      padding-bottom: 20px;
    }


    /* ================================
       GENERAL CARD
    ================================= */

    .card {
      width: 100%;
      max-width: 370px;

      padding: 28px 22px;

      border-radius: 26px;

      background:
        linear-gradient(
          145deg,
          rgba(24, 22, 17, 0.98),
          rgba(10, 10, 9, 0.98)
        );

      border: 1px solid rgba(212, 175, 55, 0.16);

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255,255,255,0.025);

      text-align: center;
    }


    /* ================================
       LOGO
    ================================= */

    .logo {
      display: block;

      width: 88px;
      height: 88px;

      object-fit: contain;

      margin: 0 auto 17px;

      filter:
        drop-shadow(0 8px 25px rgba(212,175,55,0.25));
    }

    .card h1 {
      color: #f3ead1;

      font-size: 29px;
      font-weight: 900;

      margin-bottom: 7px;
    }

    .subtitle {
      color: #928d83;

      font-size: 13px;
      line-height: 1.8;

      margin-bottom: 19px;
    }


    /* ================================
       INPUT
    ================================= */

    input {
      width: 100%;
      height: 50px;

      border-radius: 15px;

      border: 1px solid #302c22;

      background: #0c0c0b;

      color: white;

      padding: 0 16px;

      font-size: 15px;

      outline: none;

      text-align: right;

      transition: 0.2s;
    }

    input::placeholder {
      color: #68645d;
    }

    input:focus {
      border-color: #b99836;

      box-shadow:
        0 0 0 3px rgba(185,152,54,0.08);
    }


    /* ================================
       BUTTONS
    ================================= */

    .main-btn {
      width: 100%;
      min-height: 50px;

      margin-top: 12px;

      border-radius: 15px;

      background:
        linear-gradient(
          135deg,
          #e0c461,
          #b08d2d
        );

      color: #111;

      font-size: 15px;
      font-weight: 900;

      box-shadow:
        0 9px 25px rgba(184,145,42,0.18);

      transition: 0.15s;
    }

    .main-btn:active {
      transform: scale(0.97);
    }

    .secondary-btn {
      width: 100%;
      min-height: 46px;

      margin-top: 12px;

      border-radius: 14px;

      background: #10100f;

      border: 1px solid #302d25;

      color: #bfa653;

      font-size: 14px;
      font-weight: 800;
    }

    .secondary-btn:active {
      transform: scale(0.97);
    }

    .message {
      min-height: 20px;

      margin-top: 10px;

      color: #d7ad46;

      font-size: 12px;
    }


    /* ================================
       HOME
    ================================= */

    #homeScreen {
      align-items: flex-start;

      padding:
        20px
        16px
        100px;
    }

    .home-container {
      width: 100%;
      max-width: 430px;

      margin: 0 auto;
    }


    /* HOME HEADER */

    .home-header {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 4px 2px 22px;
    }

    .home-logo {
      width: 52px;
      height: 52px;

      object-fit: contain;

      flex-shrink: 0;

      filter:
        drop-shadow(0 5px 16px rgba(212,175,55,0.2));
    }

    .home-header small {
      display: block;

      color: #77736b;

      font-size: 11px;

      margin-bottom: 3px;
    }

    .home-header h2 {
      color: #eee5ce;

      font-size: 19px;
      font-weight: 900;
    }


    /* HOME TITLE */

    .home-title {
      margin: 5px 0 18px;
    }

    .home-title h1 {
      color: #ead079;

      font-size: 30px;
      font-weight: 900;

      margin-bottom: 5px;
    }

    .home-title p {
      color: #817c72;

      font-size: 13px;
    }


    /* MODE BUTTONS */

    .mode-btn {
      width: 100%;
      min-height: 78px;

      display: flex;
      align-items: center;

      gap: 13px;

      padding: 13px 15px;

      margin-bottom: 11px;

      border-radius: 19px;

      background:
        linear-gradient(
          145deg,
          #191813,
          #0c0c0b
        );

      border: 1px solid #2b281f;

      color: white;

      text-align: right;

      box-shadow:
        0 10px 28px rgba(0,0,0,0.25);

      transition: 0.15s;
    }

    .mode-btn:active {
      transform: scale(0.98);

      border-color: #806a2d;
    }

    .mode-icon {
      width: 46px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border-radius: 14px;

      background:
        linear-gradient(
          145deg,
          #27200d,
          #17140b
        );

      border: 1px solid #40351a;

      font-size: 22px;
    }

    .mode-btn div {
      flex: 1;
    }

    .mode-btn strong {
      display: block;

      color: #e0c15a;

      font-size: 17px;

      margin-bottom: 4px;
    }

    .mode-btn small {
      display: block;

      color: #77736a;

      font-size: 11px;

      line-height: 1.5;
    }

    .mode-arrow {
      color: #a88a35;

      font-size: 25px;
    }


    /* ================================
       BOTTOM NAV
    ================================= */

    .bottom-nav {
      position: fixed;

      z-index: 100;

      bottom: 9px;
      left: 50%;

      transform: translateX(-50%);

      width: calc(100% - 24px);

      max-width: 430px;

      height: 64px;

      display: flex;
      align-items: center;

      padding: 5px;

      border-radius: 20px;

      background:
        rgba(14,14,13,0.97);

      border: 1px solid #302b20;

      box-shadow:
        0 12px 40px rgba(0,0,0,0.6);

      backdrop-filter: blur(15px);
    }

    .nav-btn {
      flex: 1;

      height: 54px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      gap: 3px;

      border-radius: 15px;

      background: transparent;

      color: #625f58;

      transition: 0.2s;
    }

    .nav-btn span {
      font-size: 18px;

      line-height: 20px;
    }

    .nav-btn small {
      font-size: 9px;

      font-weight: 800;
    }

    .nav-btn.active {
      color: #dfc15a;

      background:
        linear-gradient(
          145deg,
          #24200f,
          #18150b
        );

      border: 1px solid rgba(207,169,55,0.13);
    }

    .nav-btn:active {
      transform: scale(0.92);
    }


    /* ================================
       OTHER CARDS
    ================================= */

    #onlineScreen .card,
    #offlineScreen .card,
    #playersScreen .card,
    #shkounAnaScreen .card,
    #joinScreen .card {
      max-width: 370px;
    }

    .card h2 {
      color: #ead17a;

      font-size: 24px;
      font-weight: 900;

      margin-bottom: 7px;
    }


    /* ================================
       GAME BUTTONS
    ================================= */

    .game-btn {
      width: 100%;
      min-height: 72px;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 11px 14px;

      margin-bottom: 10px;

      border-radius: 17px;

      background: #10100f;

      border: 1px solid #2b281f;

      color: white;

      text-align: right;
    }

    .game-btn:active {
      transform: scale(0.98);
    }

    .game-btn strong {
      display: block;

      color: #dfc15a;

      font-size: 16px;

      margin-bottom: 4px;
    }

    .game-btn small {
      display: block;

      color: #77736b;

      font-size: 11px;
    }


    /* ================================
       PLAYERS
    ================================= */

    .players-grid {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 9px;

      margin: 18px 0;
    }

    .player-count {
      height: 55px;

      border-radius: 15px;

      background: #10100f;

      border: 1px solid #302b20;

      color: #dfc15a;

      font-size: 19px;

      font-weight: 900;
    }

    .player-count:active {
      transform: scale(0.94);
    }


    /* ================================
       SHKOUN ANA
    ================================= */

    .game-description {
      color: #908b81;

      font-size: 13px;

      line-height: 1.8;

      margin-bottom: 15px;
    }

    .info-box {
      padding: 14px;

      margin: 15px 0;

      border-radius: 14px;

      background: #10100f;

      border: 1px solid #29261f;

      color: #858077;

      font-size: 13px;
    }

    .info-box strong {
      color: #dfc15a;
    }


    /* ================================
       PAGES
    ================================= */

    .page-container {
      width: 100%;
      max-width: 430px;

      padding: 10px 0 20px;

      text-align: center;
    }

    .page-icon {
      width: 62px;
      height: 62px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 0 auto 15px;

      border-radius: 18px;

      background:
        linear-gradient(
          145deg,
          #29220e,
          #16130b
        );

      border: 1px solid #40351c;

      font-size: 27px;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.3);
    }

    .page-container h1 {
      color: #ead17a;

      font-size: 27px;
      font-weight: 900;

      margin-bottom: 7px;
    }

    .page-container > p {
      color: #817d75;

      font-size: 13px;

      margin-bottom: 20px;
    }


    /* ================================
       SETTINGS / GAMES LIST
       VERTICAL
    ================================= */

    .list-btn {
      width: 100%;
      min-height: 72px;

      display: flex;
      align-items: center;

      gap: 13px;

      padding: 11px 14px;

      margin-bottom: 11px;

      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          #171612,
          #0e0e0d
        );

      border: 1px solid #2d2a22;

      color: white;

      text-align: right;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.18);

      transition: 0.15s;
    }

    .list-btn:active {
      transform: scale(0.98);

      border-color: #806a2d;
    }

    .list-btn > span {
      width: 43px;
      height: 43px;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;

      border-radius: 13px;

      background:
        linear-gradient(
          145deg,
          #28200c,
          #17140b
        );

      border: 1px solid #3a311b;

      font-size: 20px;
    }

    .list-btn > div {
      flex: 1;
    }

    .list-btn strong {
      display: block;

      color: #dfc15a;

      font-size: 15px;

      margin-bottom: 4px;
    }

    .list-btn small {
      display: block;

      color: #77736c;

      font-size: 11px;
    }

    .list-btn b {
      color: #a88b39;

      font-size: 24px;

      font-weight: 400;
    }


    /* ================================
       COMING SOON
    ================================= */

    .coming-soon {
      width: 100%;

      padding: 17px 14px;

      margin-top: 14px;

      border-radius: 17px;

      background: rgba(22,20,14,0.7);

      border: 1px dashed #44391e;

      text-align: center;
    }

    .coming-soon span {
      display: block;

      font-size: 22px;

      margin-bottom: 5px;
    }

    .coming-soon strong {
      display: block;

      color: #c7a94c;

      font-size: 14px;

      margin-bottom: 4px;
    }

    .coming-soon small {
      color: #706c64;

      font-size: 11px;
    }


    /* ================================
       MODAL
    ================================= */

    .modal {
      position: fixed;

      z-index: 500;

      inset: 0;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0,0,0,0.8);

      backdrop-filter: blur(8px);
    }

    .modal-box {
      position: relative;

      width: 100%;
      max-width: 370px;

      max-height: 80vh;

      overflow-y: auto;

      padding: 27px 20px 20px;

      border-radius: 22px;

      background: #11110f;

      border: 1px solid #3b321d;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.65);

      text-align: right;
    }

    .modal-box h2 {
      color: #dfc15a;

      font-size: 21px;

      margin-bottom: 14px;
    }

    .modal-box h3 {
      color: #d4b34c;

      font-size: 15px;

      margin: 17px 0 7px;
    }

    .modal-box p {
      color: #99938a;

      font-size: 13px;

      line-height: 1.8;

      margin-bottom: 8px;
    }

    .close-modal {
      position: absolute;

      top: 9px;
      left: 10px;

      width: 32px;
      height: 32px;

      border-radius: 50%;

      background: #211e17;

      color: #aaa398;

      font-size: 22px;
    }

    .modal-box input {
      margin: 8px 0 4px;
    }

    .language-btn {
      width: 100%;
      height: 50px;

      margin-top: 9px;

      border-radius: 14px;

      background: #171611;

      border: 1px solid #2e2a21;

      color: #ddd;

      font-size: 14px;

      text-align: right;

      padding: 0 15px;
    }


    /* ================================
       SMALL PHONES
    ================================= */

    @media (max-height: 650px) {

      .screen {
        padding-top: 12px;
      }

      .logo {
        width: 72px;
        height: 72px;

        margin-bottom: 10px;
      }

      .card {
        padding-top: 20px;
      }

      .home-header {
        padding-bottom: 14px;
      }

      .home-title {
        margin-bottom: 13px;
      }

      .mode-btn {
        min-height: 69px;
      }
    }
  </style>
</head>


<body>


<!-- =================================
     NAME SCREEN
================================= -->

<section id="nameScreen" class="screen">

  <div class="card">

    <img
      src="file_0000000082d081f5a7b777584ad64610.png"
      class="logo"
      alt="شكون فيكم؟"
    >

    <h1>شكون فيكم؟</h1>

    <p class="subtitle">
      اللعبة اللي تكشف شكون فيكم 😏
    </p>

    <input
      id="playerName"
      type="text"
      placeholder="اكتب اسمك"
      maxlength="20"
    >

    <button id="continueBtn" class="main-btn">
      مواصلة
    </button>

    <p id="nameMessage" class="message"></p>

  </div>

</section>


<!-- =================================
     HOME
================================= -->

<section id="homeScreen" class="screen hidden">

  <div class="home-container">

    <div class="home-header">

      <img
        src="file_0000000082d081f5a7b777584ad64610.png"
        class="home-logo"
        alt="شكون فيكم؟"
      >

      <div>
        <small>مرحبا 👋</small>
        <h2 id="welcomeName"></h2>
      </div>

    </div>


    <div class="home-title">

      <h1>شكون فيكم؟</h1>

      <p>
        اختار كيفاش تحب تلعب
      </p>

    </div>


    <button id="onlineBtn" class="mode-btn">

      <span class="mode-icon">🌐</span>

      <div>

        <strong>Online</strong>

        <small>
          العب مع أصحابك من تلفونات مختلفة
        </small>

      </div>

      <span class="mode-arrow">‹</span>

    </button>


    <button id="offlineBtn" class="mode-btn">

      <span class="mode-icon">📱</span>

      <div>

        <strong>Offline</strong>

        <small>
          العبوا مع بعضكم في نفس التلفون
        </small>

      </div>

      <span class="mode-arrow">‹</span>

    </button>

  </div>


  <nav class="bottom-nav">

    <button
      class="nav-btn active"
      data-screen="homeScreen"
    >
      <span>🏠</span>
      <small>الرئيسية</small>
    </button>

    <button
      class="nav-btn"
      data-screen="messagesScreen"
    >
      <span>💬</span>
      <small>الرسائل</small>
    </button>

    <button
      class="nav-btn"
      data-screen="gamesScreen"
    >
      <span>🎮</span>
      <small>الألعاب</small>
    </button>

    <button
      class="nav-btn"
      data-screen="settingsScreen"
    >
      <span>⚙️</span>
      <small>الإعدادات</small>
    </button>

  </nav>

</section>


<!-- =================================
     ONLINE
================================= -->

<section id="onlineScreen" class="screen hidden">

  <div class="card">

    <h2>🌐 Online</h2>

    <p class="subtitle">
      اختار كيفاش تحب تلعب
    </p>

    <button id="createRoomBtn" class="main-btn">
      🎮 إنشاء غرفة
    </button>

    <button id="joinRoomBtn" class="main-btn">
      🔑 الدخول إلى غرفة
    </button>

    <button id="onlineBackBtn" class="secondary-btn">
      ← رجوع
    </button>

  </div>

</section>


<!-- =================================
     OFFLINE
================================= -->

<section id="offlineScreen" class="screen hidden">

  <div class="card">

    <h2>📱 Offline</h2>

    <p class="subtitle">
      اختار اللعبة
    </p>


    <button id="shkounFikomBtn" class="game-btn">

      <span style="font-size:25px;">❓</span>

      <div>
        <strong>شكون فيكم؟</strong>
        <small>من 2 إلى 8 لاعبين</small>
      </div>

    </button>


    <button id="shkounAnaBtn" class="game-btn">

      <span style="font-size:25px;">🕵️</span>

      <div>
        <strong>شكون أنا؟</strong>
        <small>لاعبين فقط</small>
      </div>

    </button>


    <button id="offlineBackBtn" class="secondary-btn">
      ← رجوع
    </button>

  </div>

</section>


<!-- =================================
     PLAYERS
================================= -->

<section id="playersScreen" class="screen hidden">

  <div class="card">

    <h2>❓ شكون فيكم؟</h2>

    <p class="subtitle">
      قداش باش تلعبوا؟
    </p>


    <div class="players-grid">

      <button class="player-count" data-players="2">2</button>
      <button class="player-count" data-players="3">3</button>
      <button class="player-count" data-players="4">4</button>
      <button class="player-count" data-players="5">5</button>
      <button class="player-count" data-players="6">6</button>
      <button class="player-count" data-players="7">7</button>
      <button class="player-count" data-players="8">8</button>

    </div>


    <p id="playersMessage" class="message"></p>


    <button id="playersBackBtn" class="secondary-btn">
      ← رجوع
    </button>

  </div>

</section>


<!-- =================================
     SHKOUN ANA
================================= -->

<section id="shkounAnaScreen" class="screen hidden">

  <div class="card">

    <h2>🕵️ شكون أنا؟</h2>

    <p class="game-description">
      لعبة تخمين الشخصيات بين زوز لاعبين.
    </p>

    <div class="info-box">
      👥 عدد اللاعبين:
      <strong>2</strong>
    </div>

    <button id="startShkounAnaBtn" class="main-btn">
      🚀 ابدأ اللعبة
    </button>

    <button id="shkounAnaBackBtn" class="secondary-btn">
      ← رجوع
    </button>

  </div>

</section>


<!-- =================================
     JOIN ROOM
================================= -->

<
