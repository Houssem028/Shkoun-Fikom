<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شكون فيكم؟</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       شاشة الاسم
  ========================== -->
  <section id="nameScreen" class="screen">
    <div class="card">

      <img
        src="file_0000000082d081f5a7b777584ad64610.png"
        class="logo"
        alt="شكون فيكم؟"
      >

      <h1>شكون فيكم؟</h1>

      <p class="subtitle">
        اللعبة اللي تكشف شكون فيكم 😏
      </p>

      <input
        id="playerName"
        type="text"
        placeholder="اكتب اسمك"
        maxlength="20"
      >

      <button id="continueBtn" class="main-btn">
        مواصلة
      </button>

      <p id="nameMessage" class="message"></p>

    </div>
  </section>


  <!-- =========================
       الصفحة الرئيسية
  ========================== -->
  <section id="homeScreen" class="screen hidden">

    <div class="card">

      <img
        src="file_0000000082d081f5a7b777584ad64610.png"
        class="logo"
        alt="شكون فيكم؟"
      >

      <h1>
        شكون فيكم؟
      </h1>

      <p class="welcome">
        مرحبا <span id="welcomeName"></span> 👋
      </p>

      <button id="onlineBtn" class="mode-btn">
        🌐
        <strong>Online</strong>
        <small>العب مع أصحابك من تلفونات مختلفة</small>
      </button>

      <button id="offlineBtn" class="mode-btn">
        📱
        <strong>Offline</strong>
        <small>العبوا مع بعضكم في نفس التلفون</small>
      </button>

      <button id="changeNameBtn" class="secondary-btn">
        تغيير الاسم
      </button>

    </div>

  </section>


  <!-- =========================
       ONLINE
  ========================== -->
  <section id="onlineScreen" class="screen hidden">

    <div class="card">

      <h2>🌐 Online</h2>

      <p class="subtitle">
        اختار كيفاش تحب تلعب
      </p>

      <button id="createRoomBtn" class="main-btn">
        🎮 إنشاء غرفة
      </button>

      <button id="joinRoomBtn" class="main-btn">
        🔑 الدخول إلى غرفة
      </button>

      <button id="onlineBackBtn" class="secondary-btn">
        ← رجوع
      </button>

    </div>

  </section>


  <!-- =========================
       OFFLINE
  ========================== -->
  <section id="offlineScreen" class="screen hidden">

    <div class="card">

      <h2>📱 Offline</h2>

      <p class="subtitle">
        اختار اللعبة
      </p>

      <button id="shkounFikomBtn" class="game-btn">
        ❓
        <strong>شكون فيكم؟</strong>
        <small>من 2 إلى 8 لاعبين</small>
      </button>

      <button id="shkounAnaBtn" class="game-btn">
        🕵️
        <strong>شكون أنا؟</strong>
        <small>لاعبين فقط</small>
      </button>

      <button id="offlineBackBtn" class="secondary-btn">
        ← رجوع
      </button>

    </div>

  </section>


  <!-- =========================
       عدد اللاعبين
  ========================== -->
  <section id="playersScreen" class="screen hidden">

    <div class="card">

      <h2>❓ شكون فيكم؟</h2>

      <p class="subtitle">
        قداش باش تلعبوا؟
      </p>

      <div class="players-grid">

        <button class="player-count" data-players="2">2</button>
        <button class="player-count" data-players="3">3</button>
        <button class="player-count" data-players="4">4</button>
        <button class="player-count" data-players="5">5</button>
        <button class="player-count" data-players="6">6</button>
        <button class="player-count" data-players="7">7</button>
        <button class="player-count" data-players="8">8</button>

      </div>

      <p id="playersMessage" class="message"></p>

      <button id="playersBackBtn" class="secondary-btn">
        ← رجوع
      </button>

    </div>

  </section>


  <!-- =========================
       شكون أنا
  ========================== -->
  <section id="shkounAnaScreen" class="screen hidden">

    <div class="card">

      <h2>🕵️ شكون أنا؟</h2>

      <p class="game-description">
        لعبة تخمين الشخصيات بين زوز لاعبين.
      </p>

      <div class="info-box">
        👥 عدد اللاعبين: <strong>2</strong>
      </div>

      <button id="startShkounAnaBtn" class="main-btn">
        🚀 ابدأ اللعبة
      </button>

      <button id="shkounAnaBackBtn" class="secondary-btn">
        ← رجوع
      </button>

    </div>

  </section>


  <!-- =========================
       JOIN ROOM
  ========================== -->
  <section id="joinScreen" class="screen hidden">

    <div class="card">

      <h2>🔑 الدخول إلى غرفة</h2>

      <p class="subtitle">
        اكتب كود الغرفة
      </p>

      <input
        id="roomCode"
        type="number"
        placeholder="مثال: 123456"
      >

      <button id="joinBtn" class="main-btn">
        دخول
      </button>

      <p id="joinMessage" class="message"></p>

      <button id="backBtn" class="secondary-btn">
        ← رجوع
      </button>

    </div>

  </section>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    document.addEventListener("DOMContentLoaded", function () {

      const nameScreen = document.getElementById("nameScreen");
      const homeScreen = document.getElementById("homeScreen");
      const onlineScreen = document.getElementById("onlineScreen");
      const offlineScreen = document.getElementById("offlineScreen");
      const playersScreen = document.getElementById("playersScreen");
      const shkounAnaScreen = document.getElementById("shkounAnaScreen");
      const joinScreen = document.getElementById("joinScreen");

      const playerName = document.getElementById("playerName");
      const welcomeName = document.getElementById("welcomeName");

      const continueBtn = document.getElementById("continueBtn");
      const changeNameBtn = document.getElementById("changeNameBtn");
      const nameMessage = document.getElementById("nameMessage");

      const onlineBtn = document.getElementById("onlineBtn");
      const offlineBtn = document.getElementById("offlineBtn");

      const createRoomBtn = document.getElementById("createRoomBtn");
      const joinRoomBtn = document.getElementById("joinRoomBtn");
      const onlineBackBtn = document.getElementById("onlineBackBtn");

      const offlineBackBtn = document.getElementById("offlineBackBtn");

      const shkounFikomBtn =
        document.getElementById("shkounFikomBtn");

      const shkounAnaBtn =
        document.getElementById("shkounAnaBtn");

      const playersBackBtn =
        document.getElementById("playersBackBtn");

      const playersMessage =
        document.getElementById("playersMessage");

      const shkounAnaBackBtn =
        document.getElementById("shkounAnaBackBtn");

      const startShkounAnaBtn =
        document.getElementById("startShkounAnaBtn");

      const backBtn =
        document.getElementById("backBtn");


      // =========================
      // إخفاء كل الصفحات
      // =========================

      function hideAll() {

        nameScreen.classList.add("hidden");
        homeScreen.classList.add("hidden");
        onlineScreen.classList.add("hidden");
        offlineScreen.classList.add("hidden");
        playersScreen.classList.add("hidden");
        shkounAnaScreen.classList.add("hidden");
        joinScreen.classList.add("hidden");

      }


      // =========================
      // فتح صفحة
      // =========================

      function show(screen) {

        hideAll();

        screen.classList.remove("hidden");

      }


      // =========================
      // الاسم المحفوظ
      // =========================

      const savedName =
        localStorage.getItem("shkounPlayerName");


      if (savedName) {

        playerName.value = savedName;
        welcomeName.textContent = savedName;

        show(homeScreen);

      } else {

        show(nameScreen);

      }


      // =========================
      // مواصلة
      // =========================

      continueBtn.addEventListener("click", function () {

        const name = playerName.value.trim();

        if (!name) {

          nameMessage.textContent =
            "اكتب اسمك أولاً 👀";

          return;
        }

        if (name.length < 2) {

          nameMessage.textContent =
            "الاسم لازم يكون حرفين على الأقل 😅";

          return;
        }

        localStorage.setItem(
          "shkounPlayerName",
          name
        );

        welcomeName.textContent = name;

        nameMessage.textContent = "";

        show(homeScreen);

      });


      // =========================
      // Enter من الكيبورد
      // =========================

      playerName.addEventListener("keydown", function (event) {

        if (event.key === "Enter") {

          continueBtn.click();

        }

      });


      // =========================
      // ONLINE
      // =========================

      onlineBtn.addEventListener("click", function () {

        show(onlineScreen);

      });


      // =========================
      // OFFLINE
      // =========================

      offlineBtn.addEventListener("click", function () {

        show(offlineScreen);

      });


      // =========================
      // رجوع Online
      // =========================

      onlineBackBtn.addEventListener("click", function () {

        show(homeScreen);

      });


      // =========================
      // رجوع Offline
      // =========================

      offlineBackBtn.addEventListener("click", function () {

        show(homeScreen);

      });


      // =========================
      // إنشاء غرفة
      // =========================

      createRoomBtn.addEventListener("click", function () {

        window.location.href = "create-room.html";

      });


      // =========================
      // Join Room
      // =========================

      joinRoomBtn.addEventListener("click", function () {

        show(joinScreen);

      });


      // =========================
      // رجوع من Join
      // =========================

      backBtn.addEventListener("click", function () {

        show(onlineScreen);

      });


      // =========================
      // شكون فيكم
      // =========================

      shkounFikomBtn.addEventListener("click", function () {

        show(playersScreen);

      });


      // =========================
      // رجوع عدد اللاعبين
      // =========================

      playersBackBtn.addEventListener("click", function () {

        show(offlineScreen);

      });


      // =========================
      // اختيار اللاعبين
      // =========================

      document
        .querySelectorAll(".player-count")
        .forEach(function (button) {

          button.addEventListener("click", function () {

            const players =
              Number(button.dataset.players);

            localStorage.setItem(
              "shkounFikomPlayers",
              players
            );

            localStorage.setItem(
              "shkounCurrentGame",
              "shkoun-fikom"
            );

            window.location.href =
              "shkoun-fikom.html";

          });

        });


      // =========================
      // شكون أنا
      // =========================

      shkounAnaBtn.addEventListener("click", function () {

        show(shkounAnaScreen);

      });


      // =========================
      // رجوع شكون أنا
      // =========================

      shkounAnaBackBtn.addEventListener("click", function () {

        show(offlineScreen);

      });


      // =========================
      // بداية شكون أنا
      // =========================

      startShkounAnaBtn.addEventListener("click", function () {

        localStorage.setItem(
          "shkounAnaPlayers",
          "2"
        );

        localStorage.setItem(
          "shkounCurrentGame",
          "shkoun-ana"
        );

        window.location.href =
          "shkoun-ana.html";

      });


      // =========================
      // تغيير الاسم
      // =========================

      changeNameBtn.addEventListener("click", function () {

        localStorage.removeItem(
          "shkounPlayerName"
        );

        playerName.value = "";

        show(nameScreen);

      });

    });

  </script>

</body>
</html>
