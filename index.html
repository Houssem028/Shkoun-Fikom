<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0b12"
  >

  <title>شكون فيكم؟</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <main class="app">


    <!-- LOGO -->

    <div class="logo-section">

      <img
        src="file_0000000082d081f5a7b777584ad64610.png"
        alt="شكون فيكم؟"
        class="app-logo"
      >

      <h1>شكون فيكم؟</h1>

      <p>
        اللعبة اللي تكشف شكون فيكم 😂
      </p>

    </div>


    <!-- NAME SCREEN -->

    <section
      id="nameScreen"
      class="screen"
    >

      <div class="card">

        <h2>
          قبل ما نبدأو 👋
        </h2>

        <p>
          شنوة اسمك؟
        </p>


        <input
          id="playerName"
          type="text"
          maxlength="20"
          placeholder="اكتب اسمك هنا"
          autocomplete="off"
        >


        <button
          id="continueBtn"
          class="main-btn"
        >
          نكمل 🚀
        </button>


        <p
          id="nameMessage"
          class="message"
        ></p>

      </div>

    </section>


    <!-- HOME SCREEN -->

    <section
      id="homeScreen"
      class="screen hidden"
    >

      <div class="welcome">

        <p>
          مرحبا بيك 👋
        </p>

        <h2 id="welcomeName">
          لاعب
        </h2>

      </div>


      <div class="actions">


        <!-- CREATE ROOM -->

        <button
          id="createRoomBtn"
          class="action-btn create"
        >

          <span class="action-icon">
            🎮
          </span>

          <span>

            <strong>
              إنشاء غرفة
            </strong>

            <small>
              إنت اللي باش تدير اللعبة
            </small>

          </span>

        </button>


        <!-- JOIN ROOM -->

        <button
          id="joinRoomBtn"
          class="action-btn join"
        >

          <span class="action-icon">
            🚪
          </span>

          <span>

            <strong>
              دخول لغرفة
            </strong>

            <small>
              عندك كود الغرفة؟
            </small>

          </span>

        </button>


      </div>


      <button
        id="changeNameBtn"
        class="change-name"
      >
        ✏️ تبديل الاسم
      </button>


    </section>


    <!-- JOIN ROOM -->

    <section
      id="joinScreen"
      class="screen hidden"
    >

      <div class="card">

        <button
          id="backBtn"
          class="back-btn"
        >
          ← رجوع
        </button>


        <h2>
          دخول لغرفة 🚪
        </h2>

        <p>
          اكتب كود الغرفة اللي عطاهولك صاحبك
        </p>


        <input
          id="roomCode"
          type="tel"
          inputmode="numeric"
          maxlength="6"
          placeholder="000000"
          autocomplete="off"
        >


        <button
          id="joinBtn"
          class="main-btn"
        >
          دخول للغرفة 🎮
        </button>


        <p
          id="joinMessage"
          class="message"
        ></p>

      </div>

    </section>


    <footer>
      شكون فيكم؟ 🎮 2026
    </footer>


  </main>


  <script
    type="module"
    src="app.js"
  ></script>

</body>

</html>
