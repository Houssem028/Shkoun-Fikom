<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0b12"
  >

  <title>الغرفة — شكون فيكم؟</title>

  <link rel="stylesheet" href="style.css">

  <style>

    .room-card {
      text-align: center;
    }

    .room-title {
      font-size: 23px;
      margin-bottom: 6px;
    }

    .room-subtitle {
      color: #aaa6b8;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .code-box {
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 22px;
    }

    .code-label {
      color: #aaa6b8;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .room-code {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 7px;
      direction: ltr;
    }

    .copy-btn {
      margin-top: 12px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      color: white;
      border-radius: 12px;
      padding: 10px 18px;
      cursor: pointer;
    }

    .players-title {
      text-align: right;
      font-size: 18px;
      margin-bottom: 12px;
    }

    .players-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 20px;
    }

    .player-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 12px;
      text-align: right;
    }

    .player-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(
        135deg,
        #8b5cf6,
        #6d28d9
      );
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .player-info {
      flex: 1;
    }

    .player-name {
      font-weight: bold;
      font-size: 15px;
    }

    .player-role {
      color: #aaa6b8;
      font-size: 11px;
      margin-top: 3px;
    }

    .empty-message {
      color: #777283;
      font-size: 13px;
      padding: 10px;
    }

    .start-btn {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 15px;
      background: linear-gradient(
        135deg,
        #22c55e,
        #16a34a
      );
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .leave-btn {
      width: 100%;
      height: 48px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 15px;
      background: rgba(255,255,255,0.05);
      color: #ff8585;
      font-size: 15px;
      margin-top: 12px;
      cursor: pointer;
    }

    .waiting {
      color: #aaa6b8;
      font-size: 13px;
      margin-top: 14px;
    }

    .hidden {
      display: none !important;
    }

  </style>

</head>


<body>

  <main class="app">

    <div class="logo-section">

      <img
        src="file_0000000082d081f5a7b777584ad64610.png"
        alt="شكون فيكم؟"
        class="app-logo"
      >

      <h1>شكون فيكم؟</h1>

      <p>القعدة بدات 🎮</p>

    </div>


    <section class="screen">

      <div class="card room-card">


        <!-- ROOM CODE -->

        <h2 class="room-title">
          كود الغرفة
        </h2>

        <p class="room-subtitle">
          ابعث الكود لأصحابك باش يدخلو
        </p>


        <div class="code-box">

          <div class="code-label">
            الكود
          </div>

          <div
            id="roomCode"
            class="room-code"
          >
            ------
          </div>

          <button
            id="copyBtn"
            class="copy-btn"
          >
            📋 نسخ الكود
          </button>

        </div>


        <!-- PLAYERS -->

        <h3 class="players-title">
          اللاعبين
        </h3>

        <div
          id="playersList"
          class="players-list"
        >

          <div class="empty-message">
            جاري تحميل اللاعبين...
          </div>

        </div>


        <!-- OWNER -->

        <button
          id="startBtn"
          class="start-btn hidden"
        >
          🚀 ابدأ اللعبة
        </button>


        <div
          id="waitingMessage"
          class="waiting"
        >
          نستناو في أصحابك يدخلوا...
        </div>


        <!-- LEAVE -->

        <button
          id="leaveBtn"
          class="leave-btn"
        >
          🚪 الخروج من الغرفة
        </button>


        <p
          id="message"
          class="message"
        ></p>

      </div>

    </section>


    <footer>
      شكون فيكم؟ 🎮 2026
    </footer>

  </main>


  <script type="module">

    import {
      db,
      doc,
      getDoc,
      updateDoc,
      arrayUnion,
      onSnapshot
    } from "./firebase.js";


    const roomCodeElement =
      document.getElementById(
        "roomCode"
      );

    const playersList =
      document.getElementById(
        "playersList"
      );

    const copyBtn =
      document.getElementById(
        "copyBtn"
      );

    const startBtn =
      document.getElementById(
        "startBtn"
      );

    const waitingMessage =
      document.getElementById(
        "waitingMessage"
      );

    const leaveBtn =
      document.getElementById(
        "leaveBtn"
      );

    const message =
      document.getElementById(
        "message"
      );


    // =====================================
    // LOCAL DATA
    // =====================================

    const roomId =
      localStorage.getItem(
        "shkounRoomId"
      );

    const roomCode =
      localStorage.getItem(
        "shkounRoomCode"
      );

    const playerId =
      localStorage.getItem(
        "shkounPlayerId"
      );

    const playerName =
      localStorage.getItem(
        "shkounPlayerName"
      );

    const isOwner =
      localStorage.getItem(
        "shkounIsOwner"
      ) === "true";


    // =====================================
    // CHECK
    // =====================================

    if (
      !roomId ||
      !roomCode ||
      !playerId ||
      !playerName
    ) {

      window.location.href =
        "index.html";

    }


    roomCodeElement.textContent =
      roomCode;


    // =====================================
    // LOAD ROOM
    // =====================================

    async function loadRoom() {

      try {

        const roomRef =
          doc(
            db,
            "rooms",
            roomId
          );

        const roomSnap =
          await getDoc(roomRef);


        if (!roomSnap.exists()) {

          message.textContent =
            "الغرفة ما عادش موجودة 😕";

          return;

        }


        const room =
          roomSnap.data();


        renderPlayers(
          room.players || []
        );


      } catch (error) {

        console.error(
          "LOAD ROOM ERROR:",
          error
        );

        message.textContent =
          "صار مشكل في تحميل الغرفة 😕";

      }

    }


    // =====================================
    // REAL-TIME ROOM
    // =====================================

    function listenToRoom() {

      const roomRef =
        doc(
          db,
          "rooms",
          roomId
        );


      onSnapshot(
        roomRef,
        (snapshot) => {

          if (!snapshot.exists()) {

            message.textContent =
              "الغرفة تسكرت.";

            return;

          }


          const room =
            snapshot.data();


          roomCodeElement.textContent =
            room.code;


          renderPlayers(
            room.players || []
          );


          // إذا بدأت اللعبة
          if (
            room.status === "playing"
          ) {

            message.textContent =
              "اللعبة بدات 🎮";

          }

        },
        (error) => {

          console.error(
            "ROOM LISTENER ERROR:",
            error
          );

          message.textContent =
            "فقدنا الاتصال بالغرفة 😕";

        }
      );

    }


    // =====================================
    // RENDER PLAYERS
    // =====================================

    function renderPlayers(players) {

      playersList.innerHTML = "";


      if (!players.length) {

        playersList.innerHTML =
          `
          <div class="empty-message">
            ما فما حتى لاعب توّا
          </div>
          `;

        return;

      }


      players.forEach(
        (player, index) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "player-item";


          const avatar =
            document.createElement(
              "div"
            );

          avatar.className =
            "player-avatar";


          avatar.textContent =
            player.name
              .charAt(0)
              .toUpperCase();


          const info =
            document.createElement(
              "div"
            );

          info.className =
            "player-info";


          const name =
            document.createElement(
              "div"
            );

          name.className =
            "player-name";

          name.textContent =
            player.name;


          const role =
            document.createElement(
              "div"
            );

          role.className =
            "player-role";


          if (
            player.id ===
            localStorage.getItem(
              "shkounPlayerId"
            )
          ) {

            role.textContent =
              "إنت";

          } else if (index === 0) {

            role.textContent =
              "صاحب الغرفة 👑";

          } else {

            role.textContent =
              "لاعب";

          }


          info.appendChild(name);

          info.appendChild(role);

          item.appendChild(avatar);

          item.appendChild(info);

          playersList.appendChild(item);

        }
      );

    }


    // =====================================
    // COPY CODE
    // =====================================

    copyBtn.addEventListener(
      "click",
      async () => {

        try {

          await navigator.clipboard.writeText(
            roomCode
          );

          copyBtn.textContent =
            "✅ تم نسخ الكود";

          setTimeout(
            () => {

              copyBtn.textContent =
                "📋 نسخ الكود";

            },
            1500
          );

        } catch (error) {

          message.textContent =
            "انسخ الكود يدويًا: " +
            roomCode;

        }

      }
    );


    // =====================================
    // START GAME
    // =====================================

    if (isOwner) {

      startBtn.classList.remove(
        "hidden"
      );

      waitingMessage.textContent =
        "إنت صاحب الغرفة 👑 — استنى أصحابك يدخلوا.";

    }


    startBtn.addEventListener(
      "click",
      async () => {

        if (!isOwner) {
          return;
        }


        try {

          const roomRef =
            doc(
              db,
              "rooms",
              roomId
            );


          await updateDoc(
            roomRef,
            {
              status: "playing"
            }
          );


          message.textContent =
            "اللعبة بدات 🎮";

        } catch (error) {

          console.error(
            "START ERROR:",
            error
          );

          message.textContent =
            "ما نجّمش نبدأو اللعبة 😕";

        }

      }
    );


    // =====================================
    // LEAVE
    // =====================================

    leaveBtn.addEventListener(
      "click",
      async () => {

        window.location.href =
          "index.html";

      }
    );


    // =====================================
    // START
    // =====================================

    loadRoom();

    listenToRoom();

  </script>

</body>

</html>
