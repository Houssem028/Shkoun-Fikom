<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b0b12"
  >

  <title>إنشاء غرفة — شكون فيكم؟</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .room-create-card {
      text-align: center;
    }

    .room-create-icon {
      font-size: 55px;
      margin-bottom: 12px;
    }

    .room-create-card h2 {
      margin-bottom: 10px;
    }

    .room-create-card p {
      margin-bottom: 22px;
    }

    .loading {
      display: none;
      margin-top: 15px;
      color: #aaa6b8;
      font-size: 14px;
    }

    .error {
      color: #ff6b6b !important;
    }
  </style>
</head>

<body>

  <main class="app">

    <div class="logo-section">

      <img
        src="file_0000000082d081f5a7b777584ad64610.png"
        alt="شكون فيكم؟"
        class="app-logo"
      >

      <h1>شكون فيكم؟</h1>

      <p>حضّر القعدة وابدأ اللعب 🎮</p>

    </div>


    <section class="screen">

      <div class="card room-create-card">

        <div class="room-create-icon">
          🎮
        </div>

        <h2>
          إنشاء غرفة
        </h2>

        <p>
          باش نعملولك غرفة جديدة
          وتاخذ كود تعطيه لأصحابك.
        </p>

        <button
          id="createBtn"
          class="main-btn"
        >
          إنشاء الغرفة 🚀
        </button>

        <p
          id="loading"
          class="loading"
        >
          جاري إنشاء الغرفة...
        </p>

        <p
          id="message"
          class="message"
        ></p>

      </div>

    </section>


    <footer>
      شكون فيكم؟ 🎮 2026
    </footer>

  </main>


  <script type="module">

    import {
      db,
      collection,
      addDoc,
      serverTimestamp
    } from "./firebase.js";


    const createBtn =
      document.getElementById("createBtn");

    const loading =
      document.getElementById("loading");

    const message =
      document.getElementById("message");


    // =====================================
    // GET PLAYER NAME
    // =====================================

    const playerName =
      localStorage.getItem(
        "shkounPlayerName"
      );


    if (!playerName) {

      window.location.href =
        "index.html";

    }


    // =====================================
    // PLAYER ID
    // =====================================

    let playerId =
      localStorage.getItem(
        "shkounPlayerId"
      );


    if (!playerId) {

      if (
        window.crypto &&
        crypto.randomUUID
      ) {

        playerId =
          crypto.randomUUID();

      } else {

        playerId =
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .substring(2);

      }


      localStorage.setItem(
        "shkounPlayerId",
        playerId
      );

    }


    // =====================================
    // RANDOM 6 DIGIT CODE
    // =====================================

    function generateRoomCode() {

      return Math.floor(
        100000 +
        Math.random() * 900000
      ).toString();

    }


    // =====================================
    // CREATE ROOM
    // =====================================

    createBtn.addEventListener(
      "click",
      async () => {

        createBtn.disabled = true;

        loading.style.display =
          "block";

        message.textContent = "";


        try {

          const roomCode =
            generateRoomCode();


          const room = {

            code: Number(roomCode),

            ownerId: playerId,

            ownerName: playerName,

            players: [
              {
                id: playerId,
                name: playerName
              }
            ],

            status: "waiting",

            game: null,

            createdAt:
              serverTimestamp()

          };


          const roomRef =
            await addDoc(
              collection(db, "rooms"),
              room
            );


          // حفظ معلومات الغرفة

          localStorage.setItem(
            "shkounRoomId",
            roomRef.id
          );

          localStorage.setItem(
            "shkounRoomCode",
            roomCode
          );

          localStorage.setItem(
            "shkounIsOwner",
            "true"
          );


          // الذهاب للغرفة

          window.location.href =
            "room.html";


        } catch (error) {

          console.error(
            "CREATE ROOM ERROR:",
            error
          );


          createBtn.disabled = false;

          loading.style.display =
            "none";


          message.textContent =
            "ما نجّمش نعملو الغرفة 😕";

          message.classList.add(
            "error"
          );

        }

      }
    );

  </script>

</body>

</html>
